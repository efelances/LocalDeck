[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localdeck"
version = "0.1.1"
description = "Turn any phone or tablet on local Wi-Fi into a zero-latency wireless Stream Deck and game cockpit without installing mobile apps or accounts."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pywebview>=5.3",
    "pywin32>=306; sys_platform == 'win32'",
    "qrcode>=8.0",
    "pillow>=10.4.0",
    "pystray>=0.19.5",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
localdeck = "localdeck.__main__:main"

[tool.setuptools.packages.find]
include = ["localdeck*"]

[tool.setuptools.package-data]
localdeck = ["web/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
